<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>!!! DO NOT CLICK !!!</title>
    <style>
        /* --- 1. THE STATIC FRAME (Does not spin) --- */
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* No escape */
            background: black;
            font-family: "Comic Sans MS", "Wingdings", serif;
            cursor: none; /* Hide real cursor */
        }

        /* --- 2. THE SPINNING HELL CONTAINER --- */
        #hell-container {
            position: absolute;
            top: -50%; left: -50%; /* Center the chaos */
            width: 200vw;
            height: 200vh;
            background-color: yellow;
            
            /* Moire Pattern */
            background-image: 
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 20px, #ff0000 20px, #ff0000 40px),
                repeating-linear-gradient(45deg, #ffff00 0, #ffff00 10px, #0000ff 10px, #0000ff 20px);
            background-blend-mode: difference;
            background-size: 100px 100px;

            /* THE SPIN: 0.5s per rotation (Extremely Fast) */
            animation: spinWorld 0.5s linear infinite;
            z-index: 1; /* Behind the UI */
            
            display: none; /* Hidden until activated */
        }

        @keyframes spinWorld {
            0% { filter: hue-rotate(0deg); transform: rotate(0deg); }
            50% { filter: hue-rotate(180deg); transform: rotate(180deg); } 
            100% { filter: hue-rotate(360deg); transform: rotate(360deg); }
        }

        /* --- 3. THE STATIC TRIGGER (Easy to click) --- */
        #trap-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            color: red;
            z-index: 2147483647; /* Topmost */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer; /* Normal cursor here */
            text-align: center;
        }

        /* --- 4. THE STALKER WEBCAM (Follows Mouse, Does not spin) --- */
        #cam-container {
            position: fixed; /* Fixed to screen, not page */
            width: 300px;
            height: 220px;
            background: black;
            border: 5px solid red;
            z-index: 2000000000;
            box-shadow: 0 0 50px red;
            pointer-events: none; /* Clicks pass through so you hit popups */
            display: none; /* Hidden until active */
        }

        #real-video {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: invert(100%) contrast(150%);
            transform: scaleX(-1);
        }

        /* --- 5. THE HYDRA POPUPS --- */
        .error-popup {
            position: fixed;
            width: 300px;
            background: #c0c0c0;
            border: 4px outset white;
            padding: 5px;
            z-index: 1000000;
            box-shadow: 10px 10px 20px black;
            font-family: Arial, sans-serif;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }

        /* --- 6. BSOD OVERLAY --- */
        #bsod {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0000AA; color: white;
            font-family: monospace; z-index: 2147483646;
            padding: 50px; font-size: 24px;
            cursor: none;
        }

        /* --- 7. TRAIL DOTS --- */
        .trail-dot {
            position: fixed; /* Fixed so they stick to screen */
            width: 15px; height: 15px;
            background: lime;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100000;
        }
        
        /* --- 8. ROTATING JUNK ITEMS --- */
        .junk-item {
            position: absolute;
            background: white; border: 2px solid blue;
            padding: 5px; font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="trap-overlay" onclick="activateHell()">
        <h1 style="font-size: 80px; text-decoration: blink;">⚠️ WARNING ⚠️</h1>
        <h2>CLICK TO ENTER THE CENTRIFUGE</h2>
        <h3>(This button is safe. The rest is not.)</h3>
    </div>

    <div id="cam-container">
        <video id="real-video" autoplay playsinline muted></video>
        <div style="position:absolute; top:0; left:0; background:black; color:red; font-weight:bold;">🔴 WATCHING...</div>
    </div>

    <div id="bsod">
        FATAL ERROR: USER_SANITY_NOT_FOUND
        <br><br>
        DUMPING PHYSICAL MEMORY TO FBI...
    </div>

    <div style="position: fixed; top: 0; width: 100%; z-index: 900000; background: black; color: lime;">
        <marquee scrollamount="80" direction="right">
            <h1>HELP ME --- I AM TRAPPED IN THE COMPUTER --- DOWNLOAD RAM --- CLICK FOR PRIZE --- ERROR</h1>
        </marquee>
    </div>

    <div id="hell-container">
        </div>

    <script>
        // --- A. ACTIVATION ---
        async function activateHell() {
            const trap = document.getElementById('trap-overlay');
            trap.style.display = 'none'; // Remove the button
            
            document.getElementById('hell-container').style.display = 'block'; // Start spinning
            document.getElementById('cam-container').style.display = 'block'; // Show cam

            // 1. Force Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();

            // 2. ENABLE REAL WEBCAM
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('real-video');
                video.srcObject = stream;
            } catch (err) {
                alert("NO CAMERA? I WILL JUST STEAL YOUR DATA INSTEAD.");
            }

            // 3. Start Systems
            initAudio();
            generateJunk();
            startPopups();
            startTracking(); // Starts camera following and trail
            
            // Global Click for Scream
            document.addEventListener('mousedown', playScream);
        }

        // --- B. TRACKING LOGIC (Cam & Trail) ---
        function startTracking() {
            const cam = document.getElementById('cam-container');
            
            document.addEventListener('mousemove', (e) => {
                // 1. Move Camera (Offset slightly so you see the cursor)
                cam.style.left = (e.clientX + 10) + 'px';
                cam.style.top = (e.clientY + 10) + 'px';

                // 2. Create Trail
                if(Math.random() > 0.5) {
                    const dot = document.createElement('div');
                    dot.className = 'trail-dot';
                    dot.style.left = e.clientX + 'px';
                    dot.style.top = e.clientY + 'px';
                    dot.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
                    document.body.appendChild(dot);
                    
                    // Trail fades after 2 seconds to prevent total crash
                    setTimeout(() => dot.remove(), 2000);
                }
            });
        }

        // --- C. AUDIO TORTURE ---
        let audioCtx;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Fast TTS
            const msg = new SpeechSynthesisUtterance("I am watching you. I am watching you.");
            msg.rate = 2.0; msg.pitch = 0.1;
            setInterval(() => window.speechSynthesis.speak(msg), 2500);

            // Random Beeps
            setInterval(() => {
                if(Math.random() > 0.6) playTone(400 + Math.random() * 2000, 'sawtooth', 0.1);
            }, 150);
        }

        function playTone(freq, type, vol) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.value = vol;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playScream() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.value = 0.2; 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // --- D. CHAOS GENERATOR ---
        function generateJunk() {
            const container = document.getElementById('hell-container');
            const words = ["DIE", "ERROR", "404", "VIRUS", "SCAM", "BUY"];
            
            for(let i=0; i<300; i++) {
                const el = document.createElement('div');
                el.className = 'junk-item';
                // Position relative to the spinning container
                el.style.left = Math.random() * 200 + 'vw';
                el.style.top = Math.random() * 200 + 'vh';
                el.style.transform = `rotate(${Math.random()*360}deg)`;
                el.innerHTML = `
                    <b>${words[Math.floor(Math.random()*words.length)]}</b><br>
                    <img src="https://placehold.co/50x50?text=NO" border="1">
                `;
                container.appendChild(el);
            }
        }

        // --- E. POPUPS ---
        function createPopup() {
            const p = document.createElement('div');
            p.className = 'error-popup';
            p.style.left = Math.random() * (window.innerWidth - 300) + 'px';
            p.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            p.innerHTML = `
                <div style="background:navy; color:white; font-weight:bold;">SYSTEM FAILURE</div>
                <center><br><b>CANNOT ESCAPE</b><br><button onclick="multiplyPopup(this)">OK</button></center>
            `;
            document.body.appendChild(p);
        }

        window.multiplyPopup = function(btn) {
            btn.closest('.error-popup').remove();
            createPopup();
            createPopup();
            playScream(); 
        };

        function startPopups() {
            setInterval(createPopup, 1500);
        }

        // --- F. BSOD TRIGGER ---
        setInterval(() => {
            if(Math.random() > 0.92) {
                const bsod = document.getElementById('bsod');
                bsod.style.display = 'block';
                setTimeout(() => bsod.style.display='none', 800);
            }
        }, 1200);

    </script>
</body>
</html>
