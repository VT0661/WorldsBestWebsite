<!DOCTYPE html>
<html lang="en">
<head>

        /* --- 1. THE VISION KILLER BACKGROUND --- */
        body {
            margin: 0;
            width: 300vw; /* Arngren Width */
            height: 300vh; /* Arngren Height */
            overflow: scroll; 
            background-color: yellow;
            /* Moire Pattern that vibrates */
            background-image: 
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 20px, #ff0000 20px, #ff0000 40px),
                repeating-linear-gradient(45deg, #ffff00 0, #ffff00 10px, #ff00ff 10px, #ff00ff 20px);
            background-blend-mode: difference;
            background-size: 100px 100px;
            cursor: none; /* Hide real cursor */
            font-family: "Comic Sans MS", "Papyrus", serif;
            
            /* THE VOMIT COMET: Spin the whole page forever */
            animation: spinWorld 15s linear infinite;
        }

        @keyframes spinWorld {
            0% { filter: hue-rotate(0deg); transform: rotate(0deg); }
            50% { filter: hue-rotate(180deg); transform: rotate(180deg); } 
            100% { filter: hue-rotate(360deg); transform: rotate(360deg); }
        }

        /* --- 2. THE TRAP OVERLAY (Must click to enter hell) --- */
        #trap-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            color: red;
            z-index: 2147483647; /* Max Z-index */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            text-align: center;
        }

        /* --- 3. THE HYDRA POPUPS --- */
        .error-popup {
            position: fixed;
            width: 300px;
            background: #c0c0c0; /* Windows 95 Grey */
            border: 5px outset white;
            padding: 5px;
            z-index: 999999;
            box-shadow: 10px 10px 20px black;
            font-family: Arial, sans-serif;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* --- 4. THE JUNK ITEMS (Chaos Layout) --- */
        .junk-item {
            position: absolute;
            border: 3px solid blue;
            background: lime;
            padding: 5px;
            font-size: 10px;
            max-width: 150px;
            z-index: 100;
        }
        .junk-item:hover {
            z-index: 9999999;
            transform: scale(5) rotate(45deg);
            background: magenta;
        }

        /* --- 5. THE BSOD FLASH --- */
        #bsod {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0000AA;
            color: white;
            font-family: monospace;
            z-index: 2000000000;
            padding: 50px;
            font-size: 24px;
            cursor: none;
        }

        /* --- 6. FIXED UI HORRORS --- */
        #keylogger {
            position: fixed; bottom: 0; width: 100%;
            background: red; color: yellow;
            font-size: 40px; font-weight: bold;
            text-align: center; z-index: 1000000;
            border-top: 5px solid black;
        }

        #webcam-box {
            position: fixed; top: 10px; right: 10px;
            width: 200px; background: black; color: lime;
            border: 3px solid red; z-index: 900000;
            padding: 5px; font-family: monospace;
        }

        /* --- 7. CURSOR SWARM --- */
        .swarm-unit {
            position: absolute; width: 20px; height: 20px;
            background: red; border-radius: 50%;
            pointer-events: none; z-index: 99999999;
        }

    </style>
</head>
<body oncontextmenu="return false;">

    <div id="trap-overlay" onclick="activateHell()">
        <h1 style="font-size: 80px; text-decoration: blink;">⚠️ DANGER ⚠️</h1>
        <h2>CLICK TO VERIFY YOU ARE HUMAN</h2>
        <h3>(Do not turn off your sound)</h3>
    </div>

    <div id="bsod">
        FATAL EXCEPTION 0E.
        <br><br>
        SYSTEM HALTED.
        <br><br>
        DELETING C:\WINDOWS\SYSTEM32...
    </div>

    <div id="keylogger">LISTENING TO KEYSTROKES...</div>
    
    <div id="webcam-box">
        <b>REC: CAM_01</b><br>
        <div style="width:100%; height:100px; background:#222; display:flex; align-items:center; justify-content:center;">🔴</div>
        UPLOADING...
    </div>

    <div style="position: fixed; top: 0; width: 100%; z-index: 900000; background: black; color: lime;">
        <marquee scrollamount="50" direction="right">
            <h1>DOWNLOAD RAM --- CLICK FOR PRIZE --- HOT SINGLES --- VIRUS DETECTED --- ERROR 404</h1>
        </marquee>
    </div>

    <div style="position: fixed; bottom: 100px; left: 50px; background: white; padding: 20px; border: 5px double blue; z-index: 80000;">
        <b>ENTER CREDIT CARD:</b><br>
        <input type="text" oninput="this.value=''" placeholder="Typing is disabled..."><br><br>
        <button onmouseover="runaway(this)" style="position:relative;">SUBMIT</button>
    </div>

    <div id="chaos-container"></div>

    <script>
        // --- A. THE ACTIVATION (FULLSCREEN + AUDIO) ---
        function activateHell() {
            document.getElementById('trap-overlay').style.display = 'none';
            
            // Force Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();

            // Start all systems
            initAudio();
            generateJunk();
            startSwarm();
            startPopups();
            startLag();
            
            // Global Click Listener for Screaming
            document.addEventListener('mousedown', playScream);
            
            // Scroll Hijacking
            setInterval(() => {
                if(Math.random() > 0.8) window.scrollBy(0, Math.random() * 500 - 250);
            }, 1000);
        }

        // --- B. THE AUDIO TORTURE (Web Audio API) ---
        let audioCtx;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // 1. Robotic Voice Loop
            const msg = new SpeechSynthesisUtterance("Critical Error. Virus Detected. I see you.");
            msg.rate = 1.5; msg.pitch = 0.1;
            setInterval(() => window.speechSynthesis.speak(msg), 4000);

            // 2. Random Beeps
            setInterval(() => {
                if(Math.random() > 0.7) playTone(100 + Math.random() * 2000, 'square', 0.1);
            }, 300);
        }

        function playTone(freq, type, vol) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.value = vol;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playScream() {
            if(!audioCtx) return;
            // The "Sawtooth" drop (Sounds like a bomb falling)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
            gain.gain.value = 0.3; // Loud enough to annoy, quiet enough to not blow speakers
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- C. ARNGREN CHAOS GENERATOR ---
        function generateJunk() {
            const container = document.getElementById('chaos-container');
            const words = ["BUY", "CLICK", "ERROR", "SCAM", "FREE", "XXX", "WIN"];
            
            for(let i=0; i<400; i++) {
                const el = document.createElement('div');
                el.className = 'junk-item';
                el.style.left = Math.random() * 290 + 'vw';
                el.style.top = Math.random() * 290 + 'vh';
                el.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
                
                el.innerHTML = `
                    <b>${words[Math.floor(Math.random()*words.length)]}</b><br>
                    <img src="https://placehold.co/60x60?text=JUNK" border="1"><br>
                    <a href="#">LINK ${i}</a>
                `;
                container.appendChild(el);
            }
        }

        // --- D. THE HYDRA POPUPS (Uncloseable) ---
        function createPopup() {
            const p = document.createElement('div');
            p.className = 'error-popup';
            p.style.left = Math.random() * (window.innerWidth - 300) + 'px';
            p.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            
            p.innerHTML = `
                <div style="background:navy; color:white; font-weight:bold; padding:2px;">
                    SYSTEM ERROR 0x${Math.floor(Math.random()*999)}
                    <button style="float:right" onclick="multiplyPopup(this)">X</button>
                </div>
                <center>
                    <br><h3>FATAL EXCEPTION</h3><br>
                    <button onclick="multiplyPopup(this)">OK</button>
                </center>
            `;
            document.body.appendChild(p);
        }

        window.multiplyPopup = function(btn) {
            btn.closest('.error-popup').remove();
            createPopup();
            createPopup(); // Spawn 2
            playScream(); // Punish
        };

        function startPopups() {
            setInterval(createPopup, 3000);
        }

        // --- E. THE SWARM (Cursor Chasers) ---
        function startSwarm() {
            const swarm = [];
            for(let i=0; i<30; i++) {
                const div = document.createElement('div');
                div.className = 'swarm-unit';
                document.body.appendChild(div);
                swarm.push({el: div, delay: i*2});
            }
            document.addEventListener('mousemove', (e) => {
                swarm.forEach(unit => {
                    setTimeout(() => {
                        unit.el.style.left = (e.pageX + Math.random()*50 - 25) + 'px';
                        unit.el.style.top = (e.pageY + Math.random()*50 - 25) + 'px';
                    }, unit.delay * 10);
                });
            });
        }

        // --- F. PERFORMANCE & PSYCHOLOGY ---
        
        // 1. Lag Engine (CPU Waste)
        function startLag() {
            setInterval(() => {
                let x = 0;
                for(let i=0; i<1000000; i++) { x = Math.sqrt(i * Math.random()); }
            }, 200);
        }

        // 2. Keylogger Display
        document.addEventListener('keydown', (e) => {
            const bar = document.getElementById('keylogger');
            bar.innerText = `SENDING "${e.key.toUpperCase()}" TO FBI...`;
            bar.style.backgroundColor = (Math.random()>0.5) ? 'blue' : 'red';
            playTone(800, 'sawtooth', 0.1);
        });

        // 3. Runaway Button
        window.runaway = function(btn) {
            btn.style.position = 'absolute';
            btn.style.left = Math.random() * 300 + 'px';
            btn.style.top = Math.random() * 300 + 'px';
        };

        // 4. Random BSOD Trigger
        setInterval(() => {
            if(Math.random() > 0.92) {
                const bsod = document.getElementById('bsod');
                bsod.style.display = 'block';
                setTimeout(() => bsod.style.display='none', 2000);
            }
        }, 2000);

    </script>
</body>
</html>
