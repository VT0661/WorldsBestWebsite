<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>❤️ BE MINE FOREVER ❤️</title>
    <style>
        /* --- 1. THE STATIC FRAME --- */
        body {
            margin: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            background: #ff0000; /* Blood Red */
            font-family: "Comic Sans MS", cursive;
            cursor: none;
        }

        /* --- 2. THE SPINNING LOVE TUNNEL --- */
        #hell-container {
            position: absolute;
            top: -50%; left: -50%;
            width: 200vw; height: 200vh;
            background-color: #ff69b4; /* Hot Pink */
            
            /* VIBRATING HEART PATTERN */
            background-image: 
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 20px, #ff0000 20px, #ff0000 40px),
                repeating-linear-gradient(45deg, #ff1493 0, #ff1493 10px, #ffffff 10px, #ffffff 20px);
            background-blend-mode: difference;
            background-size: 100px 100px;

            /* FAST SPIN */
            animation: spinWorld 0.5s linear infinite;
            z-index: 1;
            display: none;
        }

        @keyframes spinWorld {
            0% { filter: hue-rotate(0deg); transform: rotate(0deg); }
            50% { filter: hue-rotate(90deg); transform: rotate(180deg); } 
            100% { filter: hue-rotate(0deg); transform: rotate(360deg); }
        }

        /* --- 3. THE TRAP (Heart Button) --- */
        #trap-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffc0cb; color: #8b0000;
            z-index: 2147483647;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; cursor: pointer; text-align: center;
        }

        /* --- 4. THE STALKER WEBCAM --- */
        #cam-container {
            position: fixed;
            width: 300px; height: 220px;
            background: pink;
            border: 10px solid #ff0000; /* Red Border */
            border-radius: 50%; /* Oval/Heart shape-ish */
            z-index: 2000000000;
            box-shadow: 0 0 50px #ff1493;
            pointer-events: none;
            display: none;
            overflow: hidden;
        }

        #real-video {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: sepia(100%) hue-rotate(300deg) saturate(300%); /* Pink Filter */
            transform: scaleX(-1);
        }

        /* --- 5. THE POPUPS --- */
        .error-popup {
            position: fixed; width: 300px;
            background: #ffb6c1; border: 4px outset #ff00ff;
            padding: 5px; z-index: 1000000;
            box-shadow: 10px 10px 20px red;
            font-weight: bold; color: red;
            animation: beat 0.5s infinite;
        }
        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- 6. RSOD (RED SCREEN OF DEATH) --- */
        #rsod {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #8b0000; color: white;
            font-family: monospace; z-index: 2147483646;
            padding: 50px; font-size: 24px;
            cursor: none;
        }

        /* --- 7. HEART TRAIL --- */
        .trail-heart {
            position: fixed; font-size: 20px;
            pointer-events: none; z-index: 100000;
        }
        
        /* --- 8. JUNK --- */
        .junk-item {
            position: absolute;
            color: red; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px white;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="trap-overlay" onclick="activateLove()">
        <h1 style="font-size: 80px;">💖 ACCEPT MY LOVE 💖</h1>
        <h2>CLICK TO BE MINE FOREVER</h2>
        <h3>(Redirecting to True Love in 60 seconds...)</h3>
    </div>

    <div id="cam-container">
        <video id="real-video" autoplay playsinline muted></video>
        <div style="position:absolute; bottom:10px; width:100%; text-align:center; color:white; font-weight:bold; font-size:20px; text-shadow:2px 2px black;">MY SOULMATE</div>
    </div>

    <div id="rsod">
        FATAL ERROR: HEART_OVERLOAD
        <br><br>
        TOO_MUCH_AFFECTION_DETECTED (0xLUV)
        <br><br>
        DUMPING FEELINGS...
    </div>

    <div style="position: fixed; top: 0; width: 100%; z-index: 900000; background: #ff1493; color: white;">
        <marquee scrollamount="80" direction="right">
            <h1>I LOVE YOU --- DO NOT RESIST --- BE MINE --- MARRY ME --- NO ESCAPE --- XOXO --- HAPPY VALENTINES</h1>
        </marquee>
    </div>

    <div id="countdown" style="position: fixed; bottom: 10px; right: 10px; font-size: 50px; color: yellow; z-index: 99999999; font-weight: bold; display:none;">
        60
    </div>

    <div id="hell-container"></div>

    <script>
        // --- A. ACTIVATION ---
        async function activateLove() {
            document.getElementById('trap-overlay').style.display = 'none';
            document.getElementById('hell-container').style.display = 'block';
            document.getElementById('cam-container').style.display = 'block';
            document.getElementById('countdown').style.display = 'block';

            // Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();

            // Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('real-video');
                video.srcObject = stream;
            } catch (err) {
                alert("WHY WON'T YOU LOOK AT ME???");
            }

            // Engines
            initAudio();
            generateLoveJunk();
            startLovePopups();
            startStalker();
            startCountdown();

            // Scream on click
            document.addEventListener('mousedown', playScream);
        }

        // --- B. THE REDIRECT LOGIC ---
        function startCountdown() {
            let timer = 60;
            const el = document.getElementById('countdown');
            
            const interval = setInterval(() => {
                timer--;
                el.innerText = timer;
                
                if (timer <= 0) {
                    clearInterval(interval);
                    // THE REDIRECT
                    window.location.href = "/loml"; 
                }
            }, 1000);
        }

        // --- C. STALKER & TRAIL ---
        function startStalker() {
            const cam = document.getElementById('cam-container');
            document.addEventListener('mousemove', (e) => {
                // Camera follows mouse
                cam.style.left = (e.clientX - 150) + 'px'; // Center on cursor
                cam.style.top = (e.clientY - 110) + 'px';

                // Heart Trail
                if(Math.random() > 0.4) {
                    const heart = document.createElement('div');
                    heart.className = 'trail-heart';
                    heart.innerText = "💔";
                    heart.style.left = e.clientX + 'px';
                    heart.style.top = e.clientY + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1000);
                }
            });
        }

        // --- D. AUDIO (ROMANTIC NIGHTMARE) ---
        let audioCtx;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // TTS: Aggressive Love
            const msg = new SpeechSynthesisUtterance("I love you. Look at me. Be mine. Forever.");
            msg.rate = 1.5; msg.pitch = 1.5; // High pitch/crazy
            setInterval(() => window.speechSynthesis.speak(msg), 4000);

            // Beeps (Heart monitor style)
            setInterval(() => {
                playTone(800, 'sine', 0.1); // Beep
                setTimeout(() => playTone(800, 'sine', 0.1), 100); // Beep
            }, 1000); // Pulse
        }

        function playTone(freq, type, vol) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.value = vol;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playScream() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            gain.gain.value = 0.2; 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- E. JUNK GENERATOR ---
        function generateLoveJunk() {
            const container = document.getElementById('hell-container');
            const words = ["LUV", "KISS", "HUG", "MINE", "FOREVER", "XOXO"];
            
            for(let i=0; i<300; i++) {
                const el = document.createElement('div');
                el.className = 'junk-item';
                el.style.left = Math.random() * 200 + 'vw';
                el.style.top = Math.random() * 200 + 'vh';
                el.style.transform = `rotate(${Math.random()*360}deg)`;
                el.innerHTML = `
                    <b>${words[Math.floor(Math.random()*words.length)]}</b><br>
                    <span style="font-size:40px">❤️</span>
                `;
                container.appendChild(el);
            }
        }

        // --- F. POPUPS ---
        function createLovePopup() {
            const p = document.createElement('div');
            p.className = 'error-popup';
            p.style.left = Math.random() * (window.innerWidth - 300) + 'px';
            p.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            p.innerHTML = `
                <div style="background:#ff1493; color:white;">PROPOSAL</div>
                <center><br><b>WILL YOU MARRY ME?</b><br><br>
                <button onclick="multiplyPopup(this)">YES</button> 
                <button onclick="multiplyPopup(this)">YES</button></center>
            `;
            document.body.appendChild(p);
        }

        window.multiplyPopup = function(btn) {
            btn.closest('.error-popup').remove();
            createLovePopup();
            createLovePopup();
            playScream(); 
        };

        function startLovePopups() {
            setInterval(createLovePopup, 2000);
        }

        // --- G. RSOD TRIGGER ---
        setInterval(() => {
            if(Math.random() > 0.95) {
                const rsod = document.getElementById('rsod');
                rsod.style.display = 'block';
                setTimeout(() => rsod.style.display='none', 1000);
            }
        }, 1500);

    </script>
</body>
</html>
