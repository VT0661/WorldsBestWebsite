<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>!!! TOO FAST TOO FURIOUS !!!</title>
    <style>
        /* --- 1. THE CENTRIFUGE BACKGROUND --- */
        body {
            margin: 0;
            width: 300vw;
            height: 300vh;
            overflow: hidden; /* Trap them */
            background-color: yellow;
            
            /* Moire Pattern */
            background-image: 
                repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 20px, #ff0000 20px, #ff0000 40px),
                repeating-linear-gradient(45deg, #ffff00 0, #ffff00 10px, #0000ff 10px, #0000ff 20px);
            background-blend-mode: difference;
            background-size: 80px 80px;
            
            cursor: none; /* Hide real cursor */
            font-family: "Comic Sans MS", "Wingdings", serif;
            
            /* THE SPEED UPGRADE: 0.5s per rotation */
            animation: spinWorld 0.5s linear infinite;
        }

        @keyframes spinWorld {
            0% { filter: hue-rotate(0deg); transform: rotate(0deg); }
            50% { filter: hue-rotate(180deg); transform: rotate(180deg); } 
            100% { filter: hue-rotate(360deg); transform: rotate(360deg); }
        }

        /* --- 2. THE TRAP OVERLAY --- */
        #trap-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            color: red;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: help;
            text-align: center;
            /* The trap does not spin, so you can actually click it */
        }

        /* --- 3. THE STALKER WEBCAM --- */
        #cam-container {
            position: absolute; /* Moves with mouse */
            width: 320px;
            height: 240px;
            background: black;
            border: 5px solid red;
            z-index: 2147483647; /* MAX Z-INDEX */
            box-shadow: 0 0 50px red;
            pointer-events: none; /* Let clicks pass through so you click popups by accident */
            transform: translate(10px, 10px); /* Offset slightly so you can see cursor */
        }

        #real-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: invert(100%) contrast(150%);
            transform: scaleX(-1);
        }

        /* --- 4. THE HYDRA POPUPS --- */
        .error-popup {
            position: fixed;
            width: 250px;
            background: #c0c0c0;
            border: 4px outset white;
            padding: 5px;
            z-index: 1000000;
            box-shadow: 10px 10px 20px black;
            font-family: Arial, sans-serif;
            animation: shake 0.1s infinite; /* Shakes violently */
        }
        
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }

        /* --- 5. PERMANENT CURSOR TRAIL --- */
        .trail-dot {
            position: absolute;
            width: 20px; height: 20px;
            background: lime;
            pointer-events: none;
            z-index: 99999999;
            border-radius: 50%;
        }

        /* --- 6. BSOD --- */
        #bsod {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0000AA; color: white;
            font-family: monospace; z-index: 2147483645;
            padding: 50px; font-size: 24px;
            cursor: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="trap-overlay" onclick="activateHell()">
        <h1 style="font-size: 80px; text-decoration: blink;">⚠️ WARNING ⚠️</h1>
        <h2>ENABLE HIGH VELOCITY MODE</h2>
        <h3>(Click to Start Camera & Spin)</h3>
    </div>

    <div id="cam-container">
        <video id="real-video" autoplay playsinline muted></video>
        <div style="position:absolute; top:5px; left:5px; color:red; font-family:monospace; font-weight:bold; background:black;">🔴 I AM WATCHING YOU</div>
    </div>

    <div id="bsod">
        FATAL ERROR: VELOCITY_LIMIT_EXCEEDED
        <br><br>
        SYSTEM MELTDOWN IMMINENT...
    </div>

    <div style="position: fixed; top: 0; width: 100%; z-index: 900000; background: black; color: lime;">
        <marquee scrollamount="100" direction="right">
            <h1>TOO FAST --- HELP ME --- VIRUS --- DOWNLOAD RAM --- ERROR 404 --- SYSTEM CRITICAL</h1>
        </marquee>
    </div>

    <div id="chaos-container"></div>

    <script>
        // --- A. ACTIVATION & WEBCAM ---
        async function activateHell() {
            document.getElementById('trap-overlay').style.display = 'none';
            
            // 1. Force Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();

            // 2. ENABLE REAL WEBCAM
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('real-video');
                video.srcObject = stream;
            } catch (err) {
                alert("NO CAMERA? I WILL JUST ASSUME YOU ARE UGLY.");
            }

            // 3. Start Engines
            initAudio();
            generateJunk();
            startPopups();
            startTrail();
            startStalkerCam();
            
            // Global Click for Scream
            document.addEventListener('mousedown', playScream);
        }

        // --- B. STALKER CAMERA LOGIC ---
        function startStalkerCam() {
            const cam = document.getElementById('cam-container');
            document.addEventListener('mousemove', (e) => {
                // The camera follows the mouse directly
                // We use fixed positioning relative to the viewport so it doesn't spin with the body
                // Wait... if body spins, coordinates get weird. 
                // We attach it to body but we update top/left based on page coordinates.
                cam.style.left = e.pageX + 'px';
                cam.style.top = e.pageY + 'px';
            });
        }

        // --- C. AUDIO TORTURE (SPEED UP) ---
        let audioCtx;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // TTS Voice (Faster rate)
            const msg = new SpeechSynthesisUtterance("Faster. Faster. Faster. I see you.");
            msg.rate = 2.0; msg.pitch = 0.1;
            setInterval(() => window.speechSynthesis.speak(msg), 3000);

            // Random Beeps (More frequent)
            setInterval(() => {
                if(Math.random() > 0.5) playTone(400 + Math.random() * 2000, 'sawtooth', 0.1);
            }, 100);
        }

        function playTone(freq, type, vol) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.value = vol;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playScream() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gain.gain.value = 0.2; 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- D. ARNGREN CHAOS GENERATOR ---
        function generateJunk() {
            const container = document.getElementById('chaos-container');
            const words = ["FATAL", "DIE", "SCAM", "BUY", "CLICK", "VIRUS"];
            
            for(let i=0; i<400; i++) {
                const el = document.createElement('div');
                el.style.position = 'absolute';
                el.style.border = '2px solid blue';
                el.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
                el.style.left = Math.random() * 290 + 'vw';
                el.style.top = Math.random() * 290 + 'vh';
                el.style.padding = '5px';
                el.style.zIndex = '100';
                el.innerHTML = `<b>${words[Math.floor(Math.random()*words.length)]}</b>`;
                container.appendChild(el);
            }
        }

        // --- E. THE HYDRA POPUPS ---
        function createPopup() {
            const p = document.createElement('div');
            p.className = 'error-popup';
            p.style.left = Math.random() * (window.innerWidth - 300) + 'px';
            p.style.top = Math.random() * (window.innerHeight - 200) + 'px';
            p.innerHTML = `
                <div style="background:red; color:white; font-weight:bold;">CRITICAL ERROR</div>
                <center><br><b>TOO FAST</b><br><button onclick="multiplyPopup(this)">OK</button></center>
            `;
            document.body.appendChild(p);
        }

        window.multiplyPopup = function(btn) {
            btn.closest('.error-popup').remove();
            createPopup();
            createPopup();
            playScream(); 
        };

        function startPopups() {
            setInterval(createPopup, 2000); // Faster spawns
        }

        // --- F. PERMANENT CURSOR TRAIL ---
        function startTrail() {
            document.addEventListener('mousemove', (e) => {
                const dot = document.createElement('div');
                dot.className = 'trail-dot';
                dot.style.left = e.pageX + 'px';
                dot.style.top = e.pageY + 'px';
                dot.style.backgroundColor = (Math.random() > 0.5) ? 'lime' : 'red';
                document.body.appendChild(dot);
            });
        }

        // --- G. BSOD TRIGGER ---
        setInterval(() => {
            if(Math.random() > 0.9) {
                const bsod = document.getElementById('bsod');
                bsod.style.display = 'block';
                setTimeout(() => bsod.style.display='none', 1000); // Shorter flash
            }
        }, 1500);

    </script>
</body>
</html>
