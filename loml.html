<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 1. ATMOSPHERE --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Soft Pink Gradient */
            background: linear-gradient(to bottom right, #ffdde1, #ee9ca7);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center vertically since no images */
            color: #5a2a2a;
        }

        /* Falling Petals Animation */
        .petal {
            position: fixed;
            top: -10vh;
            background-color: #ffb7b2;
            width: 15px;
            height: 15px;
            border-radius: 15px 0px 15px 0px;
            z-index: 0;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { top: -10vh; transform: translateX(0) rotate(0deg); opacity: 1; }
            100% { top: 110vh; transform: translateX(100px) rotate(360deg); opacity: 0; }
        }

        /* --- 2. MUSIC PLAYER BUTTON --- */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #d81b60;
        }
        .music-player:hover { transform: scale(1.05); background: white; }

        /* --- 3. MAIN CONTAINER --- */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-family: 'Parisienne', cursive;
            font-size: 3.5rem;
            color: #d81b60;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        p.subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #884444;
        }

        /* --- 4. THE INTERACTIVE ENVELOPE --- */
        .envelope-wrapper {
            position: relative;
            height: 250px;
            margin: 0 auto;
            cursor: pointer;
            perspective: 1000px;
            width: 300px;
        }

        /* The Envelope Body */
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #ff8fa3;
            margin: 0 auto;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 5;
            top: 50px;
        }

        /* The Triangles creating the envelope look */
        .envelope::after { /* Bottom Flap */
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-left: 150px solid #ff758f;
            border-right: 150px solid #ff758f;
            border-top: 100px solid transparent;
            border-bottom: 100px solid #ff5d7a;
            border-radius: 0 0 10px 10px;
            z-index: 6;
        }

        .lid {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #ff8fa3; /* Top Flap */
            transform-origin: top;
            transition: transform 0.5s ease, z-index 0.5s;
            z-index: 7;
        }

        /* The Letter Inside */
        .letter {
            position: absolute;
            top: 10px; left: 15px;
            width: 270px; height: 180px;
            background: white;
            border-radius: 5px;
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.6s ease;
            z-index: 4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }

        .letter p {
            font-family: 'Parisienne', cursive;
            font-size: 1.4rem;
            color: #d81b60;
            margin: 5px 0;
            line-height: 1.2;
        }

        /* --- OPEN ANIMATION STATES --- */
        .envelope-wrapper.open .lid {
            transform: rotateX(180deg);
            z-index: 3;
        }
        
        .envelope-wrapper.open .letter {
            transform: translateY(-160px); /* Slides up */
            z-index: 8;
        }
        
        .click-hint {
            margin-top: 60px;
            font-size: 0.9rem;
            color: #d81b60;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }

        /* --- 5. TIMER --- */
        .timer-box {
            margin-top: 60px;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: inline-block;
        }
        
        .timer-title {
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d81b60;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .t-unit { display: flex; flex-direction: column; }
        .t-label { font-size: 0.8rem; font-weight: 400; color: #555; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="petals-container"></div>

    <audio id="bg-music" loop>
        </audio>
    <div class="music-player" onclick="toggleMusic()">
        <span id="play-icon">▶</span>
        <span id="play-text" style="margin-left: 5px">Play Song</span>
    </div>

    <div class="container">
        <h1>Happy Valentine's Day</h1>
        <p class="subtitle">I promise I'm not actually a hacker. ❤️</p>

        <div class="envelope-wrapper" onclick="toggleEnvelope(this)">
            <div class="envelope">
                <div class="lid"></div>
                <div class="letter">
                    <p>To my favorite person,</p>
                    <p>Every moment since January has been magic.</p>
                    <p>I love you! ❤️</p>
                </div>
            </div>
            <div class="click-hint">Click the envelope to open</div>
        </div>

        <div class="timer-box">
            <div class="timer-title">Time since Jan 2nd, 2026</div>
            <div class="timer" id="timer"></div>
        </div>

    </div>

    <script>
        // --- 1. ENVELOPE LOGIC ---
        function toggleEnvelope(element) {
            element.classList.toggle('open');
        }

        // --- 2. PETAL RAIN ---
        function createPetals() {
            const container = document.getElementById('petals-container');
            const petalCount = 30;
            const colors = ['#ffc3a0', '#ffafbd', '#ff9a9e', '#fecfef'];

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(petal);
            }
        }
        createPetals();

        // --- 3. MUSIC PLAYER ---
        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            const text = document.getElementById('play-text');
            const icon = document.getElementById('play-icon');

            if (audio.paused) {
                // audio.play(); // Uncomment if you add a src
                text.innerText = "Pause Song";
                icon.innerText = "⏸";
                alert("Add an MP3 link in the code to play music! 🎵");
            } else {
                audio.pause();
                text.innerText = "Play Song";
                icon.innerText = "▶";
            }
        }

        // --- 4. RELATIONSHIP TIMER (UPDATED DATE) ---
        // Date: January 2nd, 2026
        const startDate = new Date("2026-01-02T00:00:00"); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            // Check if the date is in the future (safety check)
            if (diff < 0) {
                document.getElementById('timer').innerHTML = "Wait for Jan 2nd!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('timer').innerHTML = `
                <div class="t-unit">${days}<span class="t-label">Days</span></div>
                <div class="t-unit">${hours}<span class="t-label">Hrs</span></div>
                <div class="t-unit">${minutes}<span class="t-label">Mins</span></div>
                <div class="t-unit">${seconds}<span class="t-label">Secs</span></div>
            `;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

    </script>
</body>
</html>
